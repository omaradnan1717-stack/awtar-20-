nav,form,.no-print,button{display:none!important}main{max-width:none}.panel{box-shadow:none}body{background:white}}</style><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="./0DEC2553-8C77-4E51-89F2-A824319E9690.png">

</head><body><header><div style="max-width:1100px;margin:auto"><h1>مطعم وكافيه أوتار</h1><small>نظام الإدارة المالية • الإيرادات والمصروفات والديون</small></div></header><main><nav id="nav"></nav><div id="app"></div></main><script>
'use strict';const KEY='awtar_finance_v1';const tabs=[['home','لوحة التحكم'],['income','الإيرادات'],['expense','المصروفات'],['debts','الديون'],['suppliers','المجهزين'],['report','التقارير'],['backup','النسخ الاحتياطي']];let db=load(),tab='home',filterMonth=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,7);function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.entries)&&Array.isArray(x.parties))return x}catch(e){}return {entries:[],parties:[]}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('تعذر الحفظ. تحقق من مساحة الجهاز وإعدادات Safari.')}}const fmt=n=>Number(n||0).toLocaleString('en-US')+' د.ع',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>{const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Baghdad',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return ['year','month','day'].map(k=>p.find(x=>x.type===k).value).join('-')},datefmt=s=>s?`${s.slice(8,10)}/${s.slice(5,7)}/${s.slice(0,4)}`:'',id=()=>globalThis.crypto?.randomUUID?globalThis.crypto.randomUUID():String(Date.now())+Math.random(),sum=(a)=>a.reduce((s,x)=>s+Number(x.amount||0),0),entries=(type)=>db.entries.filter(x=>x.type===type),moneyField='<div><label>المبلغ (دينار عراقي)</label><input name="amount" type="number" min="1" step="1" required></div>',dateField=`<div><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div>`,noteField='<div><label>ملاحظات</label><input name="note" maxlength="300" placeholder="اختياري"></div>';function stat(name,value){return `<div class="stat"><span class="muted">${name}</span><b>${fmt(value)}</b></div>`}function render(){document.getElementById('nav').innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${n}</button>`).join('');document.getElementById('app').innerHTML=({home:home,income:()=>ledger('income'),expense:()=>ledger('expense'),suppliers:()=>parties('supplier'),debts:()=>parties('debt'),advances:()=>parties('advance'),report,backup,monthly:()=>typeof monthlyLanding==='function'?monthlyLanding():''})[tab]()}function go(t){tab=t;render()}function home(){const m=filterMonth,ins=entries('income').filter(x=>x.date.startsWith(m)),outs=entries('expense').filter(x=>x.date.startsWith(m));return `<section class="panel topline"><h2>ملخص الشهر</h2><input style="max-width:200px" type="month" value="${m}" onchange="filterMonth=this.value;render()"></section><div class="cards">${stat('إجمالي الإيرادات',sum(ins))}${stat('إجمالي المصروفات',sum(outs))}${stat('الفرق التشغيلي',sum(ins)-sum(outs))}${stat('الرصيد النقدي المسجل',cashBalance())}</div><section class="panel" style="margin-top:14px"><h2>آخر العمليات</h2>${entryTable(db.entries.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).slice(0,12),false)}</section><div class="notice">الفرق التشغيلي ليس صافي الربح المحاسبي النهائي؛ لا يشمل تكلفة المخزون المستهلك والضرائب والتسويات. الرصيد النقدي مبني على العمليات النقدية المسجلة فقط.</div>`}function cashBalance(){return db.entries.reduce((s,e)=>s+(e.method==='نقدي'?(e.type==='income'?1:e.type==='expense'?-1:0)*e.amount:0),0)}function ledger(type){const inc=type==='income',cats=inc?['مبيعات المطعم','مبيعات الكافيه','توصيل','إيراد آخر']:['مواد غذائية','مشروبات','رواتب','إيجار','كهرباء','غاز','صيانة','نقل','مستلزمات','مصروف آخر'];return `<section class="panel"><h2>إضافة ${inc?'إيراد':'مصروف'}</h2><form onsubmit="addEntry(event,'${type}')">${dateField.replace(/value="[^"]*"/,`value="${today()}"`)}${moneyField}<div><label>التصنيف</label><select name="category">${cats.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>طريقة الدفع</label><select name="method"><option>نقدي</option><option>ماستر كارد</option><option>تحويل</option><option>توصيل / منصة</option></select></div>${noteField}<button>حفظ العملية</button></form></section><section class="panel"><div class="topline"><h2>سجل ${inc?'الإيرادات':'المصروفات'}</h2><b>${fmt(sum(entries(type)))}</b></div>${entryTable(entries(type).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created),true)}</section>`}function entryTable(a,canDelete){return `<div class="scroll"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>التصنيف</th><th>المبلغ</th><th>الطريقة</th><th>ملاحظات</th>${canDelete?'<th class="no-print">إجراء</th>':''}</tr></thead><tbody>${a.map(x=>`<tr><td>${datefmt(x.date)}</td><td>${x.type==='income'?'إيراد':'مصروف'}</td><td>${esc(x.category)}</td><td>${fmt(x.amount)}</td><td>${esc(x.method)}</td><td>${esc(x.note)}</td>${canDelete?`<td class="no-print"><button class="danger" onclick="removeEntry('${x.id}')">حذف</button></td>`:''}</tr>`).join('')||`<tr><td colspan="7">لا توجد عمليات بعد</td></tr>`}</tbody></table></div>`}function addEntry(ev,type){ev.preventDefault();const f=new FormData(ev.target),amount=Number(f.get('amount'));if(!Number.isSafeInteger(amount)||amount<=0)return alert('أدخل مبلغاً صحيحاً');db.entries.push({id:id(),created:Date.now(),type,date:f.get('date'),amount,category:f.get('category'),method:f.get('method'),note:f.get('note')});save();render()}function removeEntry(k){if(confirm('حذف العملية نهائياً؟')){db.entries=db.entries.filter(x=>x.id!==k);save();render()}}const titles={supplier:'المجهزين',debt:'الديون',advance:'السلف'},singular={supplier:'مجهز',debt:'مدين',advance:'مستلم سلفة'};function balance(p){return p.movements.reduce((s,x)=>s+(x.kind==='add'?1:-1)*Number(x.amount),0)}function parties(type){const ps=db.parties.filter(x=>x.type===type);return `<section class="panel"><h2>إضافة ${singular[type]}</h2><form onsubmit="addParty(event,'${type}')"><div><label>الاسم</label><input name="name" required maxlength="100"></div><div><label>رقم الهاتف (اختياري)</label><input name="phone" maxlength="30"></div><button>إضافة</button></form></section><section class="panel"><h2>حسابات ${titles[type]}</h2><div class="cards">${stat('مجموع الدين',ps.reduce((s,p)=>s+sum(p.movements.filter(x=>x.kind==='add')),0))}${stat('مجموع التسديد',ps.reduce((s,p)=>s+sum(p.movements.filter(x=>x.kind==='pay')),0))}${stat('المتبقي',ps.reduce((s,p)=>s+balance(p),0))}${stat('عدد الحسابات',ps.length).replace(' د.ع',' حساب')}</div>${ps.map(p=>`<div class="panel" style="border:1px solid #e1e9e7;margin-top:14px"><div class="topline"><div><h3>${esc(p.name)}</h3><span class="muted">${esc(p.phone)}</span></div><div>الدين الكلي: ${fmt(sum(p.movements.filter(x=>x.kind==='add')))}<br>التسديد: ${fmt(sum(p.movements.filter(x=>x.kind==='pay')))}<br><strong>المتبقي: ${fmt(balance(p))}</strong></div></div><form onsubmit="addMovement(event,'${p.id}')">${dateField.replace(/value="[^"]*"/,`value="${today()}"`)}${moneyField}<div><label>نوع الحركة</label><select name="kind"><option value="add">${type==='supplier'?'مشتريات على الحساب':'إضافة مبلغ مستحق'}</option><option value="pay">${type==='supplier'?'تسديد للمجهز':'تسديد / استرجاع'}</option></select></div>${noteField}<button>تسجيل الحركة</button></form><div class="scroll"><table><thead><tr><th>التاريخ</th><th>الحركة</th><th>المبلغ</th><th>ملاحظات</th><th class="no-print">إجراء</th></tr></thead><tbody>${p.movements.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${datefmt(x.date)}</td><td>${x.kind==='add'?'إضافة':'تسديد'}</td><td>${fmt(x.amount)}</td><td>${esc(x.note)}</td><td class="no-print"><button class="danger" onclick="removeMovement('${p.id}','${x.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد حركات</td></tr>'}</tbody></table></div><div class="actions no-print" style="margin-top:12px"><button class="light" onclick="printParty('${p.id}')">طباعة كشف الحساب</button><button onclick="sharePartyWhatsApp('${p.id}')">إرسال عبر واتساب</button><button class="danger" onclick="removeParty('${p.id}')">حذف الحساب</button></div></div>`).join('')||'<p class="muted">لا توجد حسابات مسجلة</p>'}</section><div class="notice">حسابات الديون مستقلة عن الإيرادات والمصروفات النقدية؛ سجل المدفوعات النقدية أيضاً بقسم المصروفات أو الإيرادات عند الحاجة، لتنعكس في رصيد الصندوق. تجنب تسجيل نفس العملية مرتين في القسم نفسه.</div>`}function addParty(e,type){e.preventDefault();const f=new FormData(e.target);if(!f.get('name').trim())return alert('أدخل الاسم');db.parties.push({id:id(),type,name:f.get('name').trim(),phone:f.get('phone').trim(),movements:[]});save();render()}function addMovement(e,pid){e.preventDefault();const p=db.parties.find(x=>x.id===pid),f=new FormData(e.target),amount=Number(f.get('amount'));if(!Number.isSafeInteger(amount)||amount<=0)return alert('المبلغ غير صحيح');if(f.get('kind')==='pay'&&amount>balance(p)&&!confirm('التسديد أكبر من الرصيد المستحق. متابعة؟'))return;p.movements.push({id:id(),date:f.get('date'),amount,kind:f.get('kind'),note:f.get('note')});save();render()}function removeMovement(pid,mid){if(confirm('حذف الحركة؟')){db.parties.find(x=>x.id===pid).movements=db.parties.find(x=>x.id===pid).movements.filter(x=>x.id!==mid);save();render()}}function removeParty(pid){const p=db.parties.find(x=>x.id===pid);if(p.movements.length)return alert('احذف حركات الحساب أولاً للحفاظ على السجل');if(confirm('حذف الحساب؟')){db.parties=db.parties.filter(x=>x.id!==pid);save();render()}}function printParty(pid){const p=db.parties.find(x=>x.id===pid),w=window.open('','_blank');if(!w)return alert('اسمح بالنوافذ المنبثقة للطباعة');w.document.write(`<html dir="rtl"><meta charset="utf-8"><title>كشف حساب</title><style>body{font-family:Arial;padding:24px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #aaa;padding:9px;text-align:right}</style><h2>مطعم وكافيه أوتار - كشف حساب ${esc(p.name)}</h2><h3>الرصيد: ${fmt(balance(p))}</h3><table><tr><th>التاريخ</th><th>الحركة</th><th>المبلغ</th><th>ملاحظات</th></tr>${p.movements.map(x=>`<tr><td>${datefmt(x.date)}</td><td>${x.kind==='add'?'إضافة':'تسديد'}</td><td>${fmt(x.amount)}</td><td>${esc(x.note)}</td></tr>`).join('')}</table></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}function report(){return `<section class="panel"><h2>تقرير العمليات المالية</h2><form onsubmit="event.preventDefault();showReport()"><div><label>من تاريخ</label><input id="from" type="date" value="${today().slice(0,7)}-01" required></div><div><label>إلى تاريخ</label><input id="to" type="date" value="${today()}" required></div><button>عرض التقرير</button></form></section><section id="reportResult" class="panel"></section>`}function showReport(){const from=document.getElementById('from').value,to=document.getElementById('to').value;if(from>to)return alert('تاريخ البداية بعد النهاية');const a=db.entries.filter(x=>x.date>=from&&x.date<=to).sort((x,y)=>x.date.localeCompare(y.date)),ins=sum(a.filter(x=>x.type==='income')),outs=sum(a.filter(x=>x.type==='expense'));document.getElementById('reportResult').innerHTML=`<div class="topline"><h2>من ${datefmt(from)} إلى ${datefmt(to)}</h2><div class="actions no-print"><button onclick="window.print()">طباعة</button><button onclick="exportCSV('${from}','${to}')">تصدير CSV / Excel</button></div></div><div class="cards">${stat('الإيرادات',ins)}${stat('المصروفات',outs)}${stat('الفرق',ins-outs)}</div><h3>تفاصيل العمليات</h3>${entryTable(a,false)}`}function exportCSV(from,to){const a=db.entries.filter(x=>x.date>=from&&x.date<=to),rows=[['التاريخ','النوع','التصنيف','المبلغ','طريقة الدفع','ملاحظات'],...a.map(x=>[datefmt(x.date),x.type==='income'?'إيراد':'مصروف',x.category,x.amount,x.method,x.note])];download('\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'awtar-report.csv','text/csv;charset=utf-8')}function backup(){return `<section class="panel"><h2>النسخ الاحتياطي</h2><p>صدّر جميع البيانات إلى ملف JSON، واحفظه في تطبيق الملفات أو iCloud Drive. يمكنك استرجاعه لاحقاً.</p><div class="actions"><button onclick="download(JSON.stringify(db,null,2),'awtar-backup-${today()}.json','application/json')">تنزيل نسخة احتياطية</button></div><h3>استرجاع نسخة</h3><p class="notice">الاسترجاع يستبدل جميع البيانات الحالية. نزّل نسخة احتياطية أولاً.</p><input type="file" id="restore" accept=".json,application/json"><button style="margin-top:12px" onclick="restore()">استرجاع البيانات</button></section><section class="panel"><h2>معلومات الحفظ</h2><p>البيانات محفوظة داخل متصفح هذا الجهاز فقط، وقد تُفقد عند مسح بيانات Safari أو استخدام التصفح الخاص. النسخة لا تحتوي على تسجيل دخول أو مزامنة بين الأجهزة.</p></section>`}function download(content,name,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}async function restore(){const file=document.getElementById('restore').files[0];if(!file)return alert('اختر ملف النسخة الاحتياطية');try{const x=JSON.parse(await file.text());if(!x||!Array.isArray(x.entries)||!Array.isArray(x.parties)||!x.entries.every(e=>['income','expense'].includes(e.type)&&Number.isSafeInteger(e.amount)&&e.amount>0&&typeof e.date==='string')||!x.parties.every(p=>['supplier','debt','advance'].includes(p.type)&&Array.isArray(p.movements)&&p.movements.every(m=>['add','pay'].includes(m.kind)&&Number.isSafeInteger(m.amount)&&m.amount>0)))throw Error('invalid');if(!confirm('استبدال كل البيانات الحالية ببيانات الملف؟'))return;db=x;save();render();alert('تم الاسترجاع')}catch(e){alert('الملف غير صالح أو غير متوافق')}}
function closeStatement(){document.getElementById('statementView')?.remove();document.querySelector('main').classList.remove('hidden')}
function openStatement(title,content){closeStatement();const v=document.createElement('section');v.id='statementView';v.className='panel';v.style.margin='16px';v.innerHTML=`<div class="actions no-print"><button onclick="window.print()">طباعة / حفظ PDF</button><button class="light" onclick="closeStatement()">رجوع</button></div><h2 style="margin-top:20px">مطعم وكافيه أوتار — ${esc(title)}</h2>${content}`;document.body.append(v);document.querySelector('main').classList.add('hidden');window.scrollTo(0,0)}
printParty=function(pid){const p=db.parties.find(p=>p.id===pid);if(!p)return alert('الحساب غير موجود');let running=0;const rows=p.movements.slice().sort((a,b)=>a.date.localeCompare(b.date));openStatement('كشف حساب '+p.name,`<p>${esc(p.phone)}</p><div class="cards">${stat('الدين الكلي',sum(p.movements.filter(x=>x.kind==='add')))}${stat('مجموع التسديد',sum(p.movements.filter(x=>x.kind==='pay')))}${stat('المتبقي',balance(p))}</div><div class="scroll"><table><thead><tr><th>التاريخ</th><th>الحركة</th><th>المبلغ</th><th>الرصيد</th><th>ملاحظات</th></tr></thead><tbody>${rows.map(x=>{running+=(x.kind==='add'?1:-1)*Number(x.amount);return `<tr><td>${datefmt(x.date)}</td><td>${x.kind==='add'?'إضافة':'تسديد'}</td><td>${fmt(x.amount)}</td><td>${fmt(running)}</td><td>${esc(x.note)}</td></tr>`}).join('')||'<tr><td colspan="5">لا توجد حركات</td></tr>'}</tbody></table></div>`)};
function printLedger(type){const a=entries(type).slice().sort((a,b)=>a.date.localeCompare(b.date));openStatement(type==='expense'?'كشف المصروفات':'كشف الإيرادات',`<h3>الإجمالي: ${fmt(sum(a))}</h3>${entryTable(a,false)}`)}
const originalLedger=ledger;ledger=function(type){return originalLedger(type)+`<div class="actions no-print"><button onclick="printLedger('${type}')">عرض كشف الحساب / طباعة</button></div>`};
const originalSave=save;save=function(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('تعذر حفظ التغيير. نزّل نسخة احتياطية قبل إغلاق البرنامج.');return false}};
const originalRestore=restore;
function validDB(x){const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(Date.parse(d))&&new Date(d).toISOString().slice(0,10)===d;const ids=new Set();const validId=o=>typeof o.id==='string'&&/^[a-zA-Z0-9_.-]+$/.test(o.id)&&!ids.has(o.id)&&!!ids.add(o.id);return x&&Array.isArray(x.entries)&&Array.isArray(x.parties)&&x.entries.every(e=>validId(e)&&['income','expense'].includes(e.type)&&Number.isSafeInteger(e.amount)&&e.amount>0&&validDate(e.date))&&x.parties.every(p=>validId(p)&&typeof p.name==='string'&&p.name.trim()&&['supplier','debt','advance'].includes(p.type)&&Array.isArray(p.movements)&&p.movements.every(m=>validId(m)&&['add','pay'].includes(m.kind)&&Number.isSafeInteger(m.amount)&&m.amount>0&&validDate(m.date)))}

function revenueSummary(rows) {
  const all = revenueRows(rows), cash = all.filter(e=>e.method==='نقدي'),
    master = all.filter(e=>e.method==='ماستر كارد'), workers=all.filter(e=>e.method==='ذمم عمال'),

// Keep the navigation selection in sync for pages opened outside go().
(() => {
  const navigation = document.getElementById('nav');
  navigation.addEventListener('click', event => {
    const clicked = event.target.closest('button');
    if (!clicked) return;
    const action = clicked.getAttribute('onclick') || '';
    if (!/^(?:go\(|sharedDaily\(|cashierPage\(|management\(|employee\()/.test(action)) return;
    // go() rebuilds the buttons before this delegated listener runs.
    navigation.querySelectorAll('button').forEach(button => {
      const selected = button.getAttribute('onclick') === action;
      button.classList.toggle('active', selected);
      if (selected) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
  });
})();

<script>

<script id="awtar-partner-accounts">
/* Shared partner/customer accounts. Stored in the existing versioned cloud state. */
(()=>{
'use strict';
const debtTab=tabs.find(t=>t[0]==='debts');if(debtTab)debtTab[1]='ديون الزبائن';
const partner=p=>p.type==='advance'&&p.accountClass==='partner';
const customer=p=>p.type==='debt';
const label={safri:'سفري',cash:'سحب نقدي',other:'مبلغ آخر عليه',pay:'تسديد',funding:'مبلغ دفعه للمطعم',sale:'بيع بالدين'};
let selectedAccount=null,accountQuery='',accountMonth='',accountBusy=false;
const oldRender=render,oldParties=parties;
if(!tabs.some(t=>t[0]==='partners'))tabs.splice(tabs.findIndex(t=>t[0]==='debts')+1,0,['partners','حسابات الشركاء']);
render=function(){if(tab==='partners'&&profile?.role==='admin'){
 // Reuse the complete existing navigation and cloud/month wrappers.
 const keep=tab;tab='debts';oldRender();tab=keep;
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')==="go('partners')"));
 app.innerHTML=accountsPage(true);return;
}oldRender();};
parties=function(type){if(type==='debt')return accountsPage(false);return oldParties(type);};
const oldGo=go;go=function(t){if(t!==tab){selectedAccount=null;accountQuery='';accountMonth='';}return oldGo(t);};
const oldRevenueRows=revenueRows;revenueRows=function(rows){return oldRevenueRows(rows.filter(e=>!e.accountTransfer));};
const oldSummary=revenueSummary;revenueSummary=function(rows){return oldSummary(rows.filter(e=>!e.accountTransfer));};
const oldLedger=ledger;ledger=function(type){const all=db.entries;db.entries=all.filter(e=>!e.accountTransfer);try{return oldLedger(type);}finally{db.entries=all;}};
const oldReport=showReport;showReport=function(){const all=db.entries;db.entries=all.filter(e=>!e.accountTransfer);try{return oldReport();}finally{db.entries=all;}};
const oldTable=entryTable;entryTable=function(rows,canDelete){const html=oldTable(rows,canDelete);if(!rows.some(e=>e.accountTransfer))return html;const root=document.createElement('div');root.innerHTML=html;const trs=root.querySelectorAll('tbody tr');rows.forEach((e,i)=>{if(e.accountTransfer&&trs[i]?.cells[1])trs[i].cells[1].textContent=e.type==='income'?'قبض حساب':'سحب شريك';});return root.innerHTML;};
const oldRemoveEntry=removeEntry;removeEntry=function(key){if(db.entries.find(e=>e.id===key)?.accountMovementId)return alert('هذه الحركة مرتبطة بكشف حساب. صحّحها من حساب الشريك أو الزبون حتى يتصحح الصندوق معها.');return oldRemoveEntry(key);};
function cleanName(x){return String(x||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('ar');}
function accountRows(p){return p.movements.filter(m=>!accountMonth||m.date.slice(0,7)===accountMonth).slice().sort((a,b)=>a.date.localeCompare(b.date)||Number(a.created||0)-Number(b.created||0));}
function currentAccount(){return db.parties.find(p=>p.id===selectedAccount&&(tab==='partners'?partner(p):customer(p)));}
function phoneLink(p){const n=whatsappPhone(p.phone);return n?`<a class="btn" href="tel:+${esc(n.replace(/^\+/,''))}">اتصال</a>`:'';}
function accountsPage(isPartner){const ps=db.parties.filter(isPartner?partner:customer).slice().sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 const p=currentAccount();if(p)return detail(p,isPartner);
 const q=cleanName(accountQuery),shown=ps.filter(p=>cleanName(p.name+' '+(p.phone||'')).includes(q));
 return `<section class="panel"><h2>${isPartner?'حسابات الشركاء':'ديون الزبائن والحسابات الموجودة'}</h2><p class="muted">${isPartner?'سجل مستقل لسفري الشركاء وسحوباتهم وتسديداتهم. الرصيد الموجب عليه، والسالب إله بذمة المطعم.':'جميع حسابات الديون السابقة محفوظة هنا، بما فيها المكاتب. الحركات القديمة تبقى كما سُجّلت.'}</p><div class="cards">${stat('إجمالي المبالغ عليهم',ps.reduce((n,p)=>n+Math.max(0,balance(p)),0))}${stat('أرصدة لصالح أصحاب الحسابات',ps.reduce((n,p)=>n+Math.max(0,-balance(p)),0))}</div><label for="accountSearch">بحث بالاسم أو الرقم</label><input id="accountSearch" value="${esc(accountQuery)}" oninput="accountSearchChanged(this.value)" placeholder="اكتب الاسم أو رقم الهاتف"><div id="accountList">${accountList(shown)}</div></section><section class="panel"><h2>إضافة ${isPartner?'شريك':'زبون'}</h2><form onsubmit="createAccount(event,${isPartner})"><div><label>الاسم</label><input name="name" required maxlength="100"></div><div><label>رقم الهاتف</label><input name="phone" type="tel" maxlength="30"></div><button>إضافة الحساب</button></form></section>`;
}
function accountList(ps){return ps.map(p=>`<div class="panel" style="border:1px solid #dce9e6;margin-top:12px"><div class="topline"><div><h3>${esc(p.name)}</h3><span dir="ltr">${esc(p.phone||'')}</span></div><strong>${balance(p)>=0?'عليه: ':'إله: '}${fmt(Math.abs(balance(p)))}</strong></div><div class="actions"><button onclick="openAccount('${p.id}')">فتح الحساب</button>${phoneLink(p)}<button onclick="accountShare('${p.id}')">واتساب</button></div></div>`).join('')||'<p class="muted">لا توجد حسابات مطابقة.</p>';}
window.accountSearchChanged=value=>{accountQuery=value;const q=cleanName(value);document.getElementById('accountList').innerHTML=accountList(db.parties.filter(tab==='partners'?partner:customer).filter(p=>cleanName(p.name+' '+(p.phone||'')).includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'ar')));};
window.openAccount=pid=>{selectedAccount=pid;accountMonth='';render();};
window.backAccounts=()=>{selectedAccount=null;accountMonth='';render();};
window.accountMonthChanged=value=>{accountMonth=value;render();};
function detail(p,isPartner){const rows=accountRows(p),adds=sum(p.movements.filter(m=>m.kind==='add')),pays=sum(p.movements.filter(m=>m.kind==='pay'));
return `<section class="panel"><div class="topline"><h2>${esc(p.name)}</h2><button onclick="backAccounts()">رجوع للحسابات</button></div><p dir="ltr">${esc(p.phone||'')}</p><div class="actions">${phoneLink(p)}<button onclick="editAccount('${p.id}')">تعديل الاسم / الرقم</button><button onclick="accountShare('${p.id}')">إرسال الكشف واتساب</button><button onclick="accountPrint('${p.id}')">طباعة الكشف</button><button data-invoice-party="${esc(p.id)}" type="button">📎 فواتير الحساب</button></div><div class="cards">${stat('إجمالي المبالغ المسجلة عليه',adds)}${stat('التسديد والمبالغ لصالحه',pays)}${stat(balance(p)>=0?'المتبقي عليه — كل الفترات':'المتبقي إله — كل الفترات',Math.abs(balance(p)))}${isPartner?stat('إجمالي السفري',sum(p.movements.filter(m=>m.category==='safri')))+stat('السحب النقدي',sum(p.movements.filter(m=>m.category==='cash')))+stat('المبالغ الأخرى عليه',sum(p.movements.filter(m=>m.category==='other')))+stat('مبالغ دفعها للمطعم',sum(p.movements.filter(m=>m.category==='funding'))):''}</div></section>
<section class="panel"><h2>تسجيل حركة</h2><form onsubmit="recordAccountMovement(event,'${p.id}')"><div><label>التاريخ</label><input name="date" type="date" value="${today()}" max="${today()}" required></div><div><label>الحركة</label><select name="category" onchange="accountCategoryChanged(this.form)">${(isPartner?['safri','cash','other','pay','funding']:['sale','pay']).map(k=>`<option value="${k}">${label[k]}</option>`).join('')}</select></div>${moneyField}<div><label>التفاصيل / رقم الوصل</label><input name="note" maxlength="300"></div><div id="accountSaleBox" ${isPartner?'hidden':''}><label>احتساب المبيعات</label><select name="saleMode"><option value="recorded">مسجلة ضمن المبيعات / مطابقة الكاشير — لا تضفها مرة ثانية</option><option value="new">مبيعات جديدة لم تُسجّل — أضف بيعاً آجلاً</option></select></div><div><label>صورة الوصل (اختياري)</label><input name="receipt" type="file" accept="image/*"><label>أو تصوير بالكاميرا</label><input name="camera" type="file" accept="image/*" capture="environment"></div><p class="muted" style="grid-column:1/-1">السفري يُسجّل بالمبلغ المتفق عليه (كلفة أو سعر بيع) ولا يُخصم نقداً. السحب النقدي ينقص الصندوق، والتسديد النقدي يزيده دون احتسابه مبيعات جديدة. المبلغ الذي يدفعه الشريك للمطعم هنا هو نقد يودعه بالصندوق؛ المصروف الذي يدفعه مباشرةً لمجهز يُسجّل «مبلغاً لصالحه بدون إيداع نقدي».</p>${isPartner?'<div><label>عند مبلغ دفعه للمطعم</label><select name="fundingMode"><option value="cash">إيداع نقدي بالصندوق</option><option value="noncash">مبلغ لصالحه بدون إيداع نقدي</option></select></div>':''}<button type="submit">حفظ الحركة</button><p id="accountSaveStatus" role="status"></p></form></section>
<section class="panel"><h2>كشف الحركات</h2><label>تصفية الشهر — اتركه فارغاً لكل الفترات</label><input type="month" value="${esc(accountMonth)}" onchange="accountMonthChanged(this.value)"><p class="muted">المبالغ بالأعلى لكل الفترات. ${!isPartner?'الحركات القديمة لم تُربط تلقائياً بالصندوق؛ لا تُعد تسجيل تسديد قديم موجود بالإيرادات.':''}</p>${movementTable(p,rows,true)}</section>`;}
window.accountCategoryChanged=f=>{const box=f.querySelector('#accountSaleBox');if(box)box.hidden=f.elements.category.value!=='sale';};
function movementTable(p,rows,actions){let running=p.movements.filter(m=>accountMonth&&m.date.slice(0,7)<accountMonth).reduce((n,m)=>n+(m.kind==='add'?1:-1)*m.amount,0);return `<div class="scroll"><table><thead><tr><th>التاريخ</th><th>الحركة</th><th>المبلغ</th><th>الرصيد عليه</th><th>التفاصيل</th>${actions?'<th>إجراء</th>':''}</tr></thead><tbody>${rows.map(m=>{running+=(m.kind==='add'?1:-1)*m.amount;return `<tr><td>${datefmt(m.date)}</td><td>${esc(label[m.category]||(m.kind==='add'?'إضافة سابقة':'تسديد سابق'))}</td><td>${fmt(m.amount)}</td><td>${fmt(running)}</td><td>${esc(m.note||'')}${m.cashEffect?'<br><small>مرتبط بالصندوق</small>':''}</td>${actions?`<td>${m.receipt?`<button onclick="accountReceipt('${p.id}','${m.id}')">صورة الوصل</button>`:''}${m.accountVersion?`<button class="danger" onclick="deleteAccountMovement('${p.id}','${m.id}')">حذف / تصحيح</button>`:'<small>حركة سابقة محفوظة</small>'}</td>`:''}</tr>`;}).join('')||'<tr><td colspan="6">لا توجد حركات</td></tr>'}</tbody></table></div>`;}
function ensureDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||new Date(date+'T12:00:00Z').toISOString().slice(0,10)!==date||date>today())throw Error('التاريخ غير صحيح أو مستقبلي');if(date.slice(0,7)<today().slice(0,7)&&(!monthlyStatus||monthLocked(date.slice(0,7))))throw Error('افتح الشهر للتصحيح من الإقفال الشهري أولاً');}
async function commitAccounts(next){if(profile?.role!=='admin')throw Error('غير مخوّل');if(accountBusy||monthPendingSave)throw Error('انتظر اكتمال الحفظ الحالي');accountBusy=true;busy(true);const expected=revision,uid=session.user.id;try{const rev=await api('/rest/v1/rpc/awtar_save',{body:next,expected});if(uid!==session?.user?.id)throw Error('تغيّرت جلسة الدخول');db=structuredClone(next);committed=structuredClone(next);revision=rev;render();}catch(error){if(uid===session?.user?.id){try{await refreshAdmin();if(monthCanonical(db)===monthCanonical(next)){render();return;}}catch(_){}render();}throw Error('تعذّر تأكيد الحفظ. راجع السجل قبل إعادة الإدخال: '+error.message);}finally{accountBusy=false;busy(false);}}
window.createAccount=async(e,isPartner)=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;try{if(db.parties.some(p=>(isPartner?partner(p):customer(p))&&cleanName(p.name)===cleanName(name)))throw Error('هذا الاسم موجود، افتح حسابه الحالي');const next=structuredClone(db);next.parties.push({id:id(),name,phone:String(f.get('phone')||'').trim(),type:isPartner?'advance':'debt',accountClass:isPartner?'partner':'customer',movements:[]});await commitAccounts(next);}catch(x){alert(x.message);}};
window.editAccount=async pid=>{const p=db.parties.find(p=>p.id===pid);if(!p)return;const name=prompt('اسم صاحب الحساب',p.name);if(!name?.trim())return;const phone=prompt('رقم الهاتف',p.phone||'');if(phone===null)return;try{const next=structuredClone(db),q=next.parties.find(p=>p.id===pid);q.name=name.trim();q.phone=phone.trim();await commitAccounts(next);}catch(x){alert(x.message);}};
async function receiptImage(file){if(!file)return '';if(!file.type.startsWith('image/'))throw Error('اختر صورة للوصل');if(file.size>15000000)throw Error('الصورة كبيرة، اختر صورة أقل من 15 ميغابايت');const url=URL.createObjectURL(file);try{const im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=()=>j(Error('تعذّر فتح الصورة، جرّب JPG أو لقطة شاشة'));im.src=url;});const k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));const ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.8);if(data.length>700000)throw Error('الصورة مفصلة وكبيرة. استخدم زر فواتير الحساب لحفظ الأصل، وسجّل الحركة بدون صورة.');return data;}finally{URL.revokeObjectURL(url);}}
function buildMovement(state,pid,values){const next=structuredClone(state),p=next.parties.find(p=>p.id===pid);if(!p||!(partner(p)||customer(p)))throw Error('الحساب غير موجود');const category=values.category,isPartner=partner(p);if(!(isPartner?['safri','cash','other','pay','funding']:['sale','pay']).includes(category))throw Error('نوع الحركة غير صحيح');const amount=Number(values.amount);if(!Number.isSafeInteger(amount)||amount<=0)throw Error('أدخل مبلغاً صحيحاً أكبر من صفر');const mid=values.id||id(),kind=['pay','funding'].includes(category)?'pay':'add';if(p.movements.some(m=>m.id===mid))throw Error('الحركة مسجلة مسبقاً');const cashEffect=category==='cash'?-amount:category==='pay'||(category==='funding'&&values.fundingMode!=='noncash')?amount:0;
const m={id:mid,date:values.date,kind,category,amount,note:values.note||'',created:Date.now(),accountVersion:1,cashEffect};if(values.receipt)m.receipt=values.receipt;p.movements.push(m);
if(cashEffect||(!isPartner&&category==='sale'&&values.saleMode==='new'))next.entries.push({id:id(),created:Date.now(),date:values.date,type:cashEffect<0?'expense':'income',amount,method:cashEffect?'نقدي':'ذمم زبائن',category:cashEffect?((isPartner?'حساب شريك: ':'تسديد زبون: ')+p.name):'مبيعات آجلة للزبائن',note:values.note||'',accountMovementId:mid,accountPartyId:pid,accountTransfer:!!cashEffect});return next;}
window.recordAccountMovement=async(e,pid)=>{e.preventDefault();const form=e.target;if(form.dataset.sending)return;form.dataset.sending='1';form.querySelector('button[type=submit]').disabled=true;try{const f=new FormData(form),values=Object.fromEntries(f);ensureDate(values.date);const p=db.parties.find(p=>p.id===pid);if(values.category==='pay'&&Number(values.amount)>balance(p)&&!confirm('التسديد أكبر من المبلغ عليه وسيظهر رصيد لصالحه. متابعة؟'))return;values.receipt=await receiptImage(form.elements.receipt.files[0]||form.elements.camera.files[0]);const next=buildMovement(db,pid,values);await commitAccounts(next);}catch(x){if(form.isConnected)form.querySelector('#accountSaveStatus').textContent=x.message;else alert(x.message);}finally{delete form.dataset.sending;if(form.isConnected)form.querySelector('button[type=submit]').disabled=false;}};
window.deleteAccountMovement=async(pid,mid)=>{try{const p=db.parties.find(p=>p.id===pid),m=p?.movements.find(m=>m.id===mid);if(!m?.accountVersion)throw Error('الحركة السابقة محفوظة');ensureDate(m.date);if(!confirm('حذف الحركة وتصحيح أثرها على الصندوق والمبيعات المرتبطة بها؟'))return;const next=structuredClone(db);next.parties.find(p=>p.id===pid).movements=p.movements.filter(m=>m.id!==mid);next.entries=next.entries.filter(e=>!(e.accountMovementId===mid&&e.accountPartyId===pid));await commitAccounts(next);}catch(x){alert(x.message);}};
const oldRemoveMovement=removeMovement;removeMovement=function(pid,mid){const m=db.parties.find(p=>p.id===pid)?.movements.find(m=>m.id===mid);return m?.accountVersion?window.deleteAccountMovement(pid,mid):oldRemoveMovement(pid,mid);};
window.accountReceipt=(pid,mid)=>{const p=db.parties.find(p=>p.id===pid),m=p?.movements.find(m=>m.id===mid);if(!m?.receipt?.startsWith('data:image/jpeg;base64,'))return;openStatement('وصل '+p.name,`<p>${datefmt(m.date)} — ${fmt(m.amount)} — ${esc(m.note)}</p><img alt="صورة الوصل" src="${esc(m.receipt)}" style="max-width:100%;height:auto">`);};
window.accountPrint=pid=>{const p=db.parties.find(p=>p.id===pid);if(!p)return;openStatement('كشف '+p.name,`<p>${esc(p.phone||'')} — ${accountMonth?esc(accountMonth):'كل الفترات'}</p><h3>${balance(p)>=0?'المتبقي عليه':'المتبقي إله'}: ${fmt(Math.abs(balance(p)))}</h3>${movementTable(p,accountRows(p),false)}`);};
window.accountShare=pid=>{const p=db.parties.find(p=>p.id===pid);if(!p)return;const phone=whatsappPhone(p.phone);if(!phone)return alert('أضف رقم هاتف صحيحاً أولاً');const rows=accountRows(p),text=['مطعم وكافيه أوتار','كشف حساب: '+p.name,accountMonth?'الشهر: '+accountMonth:'كل الفترات',...rows.map(m=>`${datefmt(m.date)} | ${label[m.category]||(m.kind==='add'?'إضافة':'تسديد')} | ${fmt(m.amount)} | ${m.note||''}`),(balance(p)>=0?'المتبقي عليه: ':'المتبقي إله: ')+fmt(Math.abs(balance(p)))].join('\n');window.open('https://wa.me/'+phone.replace(/^\+/,'')+'?text='+encodeURIComponent(text),'_blank','noopener');};

})();

</script>
